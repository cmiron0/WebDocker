
## nginx

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # La publicación de Blazor genera versiones .gz de cada fichero. Con
    # gzip_static, nginx sirve esas versiones ya comprimidas (descarga mucho
    # más ligera del runtime de .NET, que es lo más pesado del cliente).
    gzip_static on;

    # Blazor WebAssembly es una SPA: las rutas del cliente (por ejemplo /servers
    # o /servers/5) no existen como ficheros en disco. Se devuelve index.html y
    # el enrutador de Blazor resuelve la ruta en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tipo MIME correcto para los binarios WebAssembly (.wasm). El nginx de
    # Ubuntu 22.04 no lo trae por defecto, y el navegador lo necesita para
    # poder cargar el runtime de .NET.
    location ~* \.wasm$ {
        default_type application/wasm;
    }
}
